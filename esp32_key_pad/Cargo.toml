[package]
name = "esp32_key_pad"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "esp32_key_pad"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }

# esp-hal 生态
esp-hal = { version = "1.0.0-rc.0", features = ["esp32", "unstable"] }
esp-hal-embassy = { version = "0.8", features = ["esp32"] }
esp-backtrace = { version = "0.15", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.13", features = ["esp32", "log"] }
esp-alloc = { version = "0.7" }
esp-bootloader-esp-idf = "0.1"

embassy-executor = { version = "0.7", features = ["executor-thread"] }
embassy-time = "0.4"
embassy-sync = "0.6"

# 协议序列化
postcard = { version = "1.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }

# nRF24L01 驱动 (embedded-hal 1.0)
rf24-rs = { version = "0.3", default-features = false }

log = "0.4"
nb = "1"

# I2C 12864 OLED (SSD1306)
embedded-graphics = "0.8"
embedded-hal-bus = "0.3"
ssd1306 = "0.10"
heapless = "0.8"

[features]
default = []

[build-dependencies]
esp-build = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
