[package]
name = "esp32_key_pad"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "esp32_key_pad"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }

# esp-hal 1.0 (2025-10 稳定版), 原版 ESP32 Xtensa
esp-hal = { version = "1.0", features = ["esp32", "unstable"] }
esp-hal-embassy = { version = "0.6", features = ["esp32"] }
esp-backtrace = { version = "0.15", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.14", features = ["esp32", "log"] }
esp-alloc = { version = "0.7" }

embassy-executor = { version = "0.7", features = ["executor-thread"] }
embassy-time = "0.4"
embassy-sync = "0.7"

# 协议序列化
postcard = { version = "1.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }

# nRF24L01 驱动 (embedded-hal 1.0).骨架阶段未实例化, 保留便于后续接入。
rf24-rs = { version = "0.3", default-features = false }

log = "0.4"

[features]
default = []

[build-dependencies]
esp-build = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
